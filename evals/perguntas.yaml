# ── SQL guardado: o que nenhuma métrica responde sozinha ─────────────────────

- id: sql_nordeste_acima_45
  grupo: sql
  pergunta: "Quais capitais do Nordeste gastaram mais de 45% da RCL com pessoal em 2025?"
  ferramentas: [consultar_sql, ranking_despesa_com_pessoal]
  # Sem nao_contem: citar Recife ou Salvador "abaixo de 45%" é resposta certa e
  # completa. A primeira versão desta régua reprovava isso (rodada da DeepSeek, 06/10).
  contem: ["João Pessoa", "Fortaleza"]

- id: sql_media_pessoal_2024
  grupo: sql
  pergunta: "Qual foi a média do percentual de despesa com pessoal das capitais em 2024?"
  ferramentas: [consultar_sql]
  verdades:
    - "SELECT round(avg(percentual_rcl), 2) FROM despesa_pessoal WHERE ano = 2024"

- id: sql_saude_sul
  grupo: sql
  pergunta: "Quanto as capitais do Sul gastaram juntas com saúde em 2025?"
  ferramentas: [consultar_sql]
  verdades:
    - "SELECT sum(liquidada) FROM despesa_funcao WHERE regiao = 'Sul' AND funcao = 'Saúde' AND ano = 2025"

- id: sql_crescimento_rcl
  grupo: sql
  pergunta: "Qual capital teve o maior crescimento percentual da receita corrente líquida entre 2023 e 2025?"
  ferramentas: [consultar_sql]
  verdades:
    - >-
      SELECT round(max(100 * (b.rcl - a.rcl) / a.rcl), 2)
      FROM receita_corrente_liquida a JOIN receita_corrente_liquida b USING (capital)
      WHERE a.ano = 2023 AND b.ano = 2025
  contem: ["Boa Vista"]

