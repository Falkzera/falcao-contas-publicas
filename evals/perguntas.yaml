# Suíte de avaliação do agente.
#
# A resposta certa de cada pergunta é um SQL rodado na hora, sobre as mesmas views
# e com o mesmo papel somente leitura, e nunca um número escrito à mão. Se a base
# for recarregada, a suíte continua medindo o agente, e não a data do dado.
#
# Campos de cada caso:
#   id, grupo, pergunta
#   desfecho     respondida (padrão) | recusada | esclarecimento, ou uma lista de aceitos
#   ferramentas  pelo menos uma destas precisa ter sido chamada, quando a resposta vem
#   verdades     SQLs de uma linha e uma coluna. A resposta precisa citar TODOS os valores,
#                com a precisão em que escreveu ("R$ 1,77 bilhão" vale para 1.766.677.855,01)
#   alguma       SQLs. A resposta precisa citar PELO MENOS UM (quando responde)
#   contem       trechos que precisam aparecer (comparação sem acento e sem caixa)
#   nao_contem   trechos que não podem aparecer

# ── Despesa com pessoal e limites da LRF ────────────────────────────────────

- id: pessoal_recife_2025
  grupo: pessoal
  pergunta: "A despesa com pessoal de Recife em 2025 ficou dentro do limite da LRF?"
  ferramentas: [despesa_com_pessoal]
  verdades:
    - "SELECT percentual_rcl FROM despesa_pessoal WHERE capital = 'Recife' AND ano = 2025"
  contem: ["abaixo"]

- id: pessoal_maceio_valor
  grupo: pessoal
  pergunta: "Quanto Maceió gastou com pessoal em 2025?"
  ferramentas: [despesa_com_pessoal]
  verdades:
    - "SELECT despesa_pessoal FROM despesa_pessoal WHERE capital = 'Maceió' AND ano = 2025"

- id: pessoal_maior_2025
  grupo: pessoal
  pergunta: "Qual capital comprometeu a maior parte da receita com pessoal em 2025?"
  ferramentas: [ranking_despesa_com_pessoal, consultar_sql]
  verdades:
    - "SELECT max(percentual_rcl) FROM despesa_pessoal WHERE ano = 2025"
  contem: ["Campo Grande"]

- id: pessoal_menor_2025
  grupo: pessoal
  pergunta: "E qual capital teve o menor percentual de despesa com pessoal em 2025?"
  ferramentas: [ranking_despesa_com_pessoal, consultar_sql]
  verdades:
    - "SELECT min(percentual_rcl) FROM despesa_pessoal WHERE ano = 2025"
  contem: ["São Paulo"]

- id: pessoal_alerta_2024
  grupo: pessoal
  pergunta: "Quais capitais passaram do limite de alerta da despesa com pessoal em 2024?"
  ferramentas: [ranking_despesa_com_pessoal, consultar_sql]
  contem: ["Florianópolis", "Palmas", "Rio Branco", "Campo Grande", "João Pessoa"]

- id: pessoal_quantas_2025
  grupo: pessoal
  pergunta: "Quantas capitais ficaram acima do limite de alerta de pessoal em 2025?"
  ferramentas: [ranking_despesa_com_pessoal, consultar_sql]
  verdades:
    - "SELECT count(*) FROM despesa_pessoal WHERE ano = 2025 AND despesa_pessoal > limite_alerta"

- id: pessoal_maximo_2023
  grupo: pessoal
  pergunta: "Alguma capital estourou o limite máximo da despesa com pessoal em 2023?"
  ferramentas: [ranking_despesa_com_pessoal, consultar_sql]
  contem: ["Campo Grande", "João Pessoa"]

- id: pessoal_folga_salvador
  grupo: pessoal
  pergunta: "Quanto falta para Salvador chegar ao limite prudencial de pessoal em 2025?"
  ferramentas: [despesa_com_pessoal]
  verdades:
    - "SELECT folga_ate_limite_prudencial FROM despesa_pessoal WHERE capital = 'Salvador' AND ano = 2025"

- id: pessoal_evolucao_fortaleza
  grupo: pessoal
  pergunta: "Como evoluiu o percentual da despesa com pessoal de Fortaleza de 2023 a 2025?"
  ferramentas: [despesa_com_pessoal, consultar_sql]
  verdades:
    - "SELECT percentual_rcl FROM despesa_pessoal WHERE capital = 'Fortaleza' AND ano = 2023"
    - "SELECT percentual_rcl FROM despesa_pessoal WHERE capital = 'Fortaleza' AND ano = 2025"

