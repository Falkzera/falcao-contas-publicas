# Postgres local. O papel somente leitura do agente é criado pela carga
# (sql/03-papel-leitura.sql), não aqui.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: contas
      POSTGRES_USER: contas
      POSTGRES_PASSWORD: contas
    ports:
      - "127.0.0.1:${PORTA_DB:-5437}:5432"
    volumes:
      - dados-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contas -d contas"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  dados-pg:
